<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى فيسبوك</title>
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="facebook-container">
        <!-- القسم الأيمن: الترحيب والشعار -->
        <div class="fb-info">
            <h1 class="fb-logo">facebook</h1>
            <p>يساعدك فيسبوك على التواصل والمشاركة مع الأشخاص الذين تعرفهم.</p>
        </div>

        <!-- القسم الأيسر: نموذج تسجيل الدخول -->
        <div class="fb-form-wrapper">
            <div class="fb-card">
                <form id="loginForm">
                    <input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    <input type="password" id="password" placeholder="كلمة السر" required>
                    <button type="submit" class="login-btn">تسجيل الدخول</button>
                </form>
                
                <a href="#" class="forgot-pass">هل نسيت كلمة السر؟</a>
                
                <hr class="divider">
                
                <div class="create-account-container">
                    <button type="button" class="create-btn">إنشاء حساب جديد</button>
                </div>
            </div>
            
            <div class="fb-page-footer">
                <p><b>إنشاء صفحة</b> لشخصية مشهورة أو علامة تجارية أو شركة.</p>
            </div>
        </div>
    </div>

    <!-- كود الـ JavaScript (يمكن وضعه هنا أو في ملف منفصل script.js) -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if(email && password) {
                alert('تم النقر على تسجيل الدخول بنجاح! (هذه صفحة تجريبية)');
            }
        });
    </script>
</body>
</html>
