<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('11381059848964530080.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 26px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم الخاص بك" required>
            </div>

            <button type="submit" class="btn-submit">دخول</button>
            <div id="message"></div>
        </form>

        <div class="register-link">
            ليس لديك حساب؟ <a href="regster.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- كود ربط Firebase والتحقق وتحديث الحالة والتوجيه -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, setDoc, doc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCtf2ltWCvw6uW8LqpC2BCXKMoc76KjXVU",
            authDomain: "faceb-bb002.firebaseapp.com",
            projectId: "faceb-bb002",
            storageBucket: "faceb-bb002.firebasestorage.app",
            messagingSenderId: "456482622109",
            appId: "1:456482622109:web:32a45c12e5f1b2a210e274",
            measurementId: "G-5Y46BEF6V1"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();

            if (usernameInput === '') {
                message.style.color = 'red';
                message.textContent = 'يرجى إدخال اسم المستخدم!';
                return;
            }

            message.style.color = '#555';
            message.textContent = 'جاري التحقق من الحساب...';

            try {
                // 1. البحث في جدول users للتأكد من وجود اسم المستخدم
                const usersRef = collection(db, "users");
                const qUser = query(usersRef, where("username", "==", usernameInput));
                const userSnapshot = await getDocs(qUser);

                if (!userSnapshot.empty) {
                    
                    // 2. البحث في مجموعة statsus عن المستند الخاص بهذا المستخدم بناءً على حقل username
                    const statsusCollectionRef = collection(db, "statsus");
                    const qStatsus = query(statsusCollectionRef, where("username", "==", usernameInput));
                    const statsusSnapshot = await getDocs(qStatsus);

                    if (!statsusSnapshot.empty) {
                        // إذا وُجد مستند خاص بالمستخدم مسبقاً، نقوم بتحديث حقل statsus إلى online
                        let statsusDocRef = statsusSnapshot.docs[0].ref;
                        await updateDoc(statsusDocRef, {
                            statsus: "online"
                        });
                    } else {
                        // إذا لم يكن له مستند مسبق في مجموعة statsus، نقوم بإنشاء مستند جديد
                        const newStatsusRef = doc(collection(db, "statsus"));
                        await setDoc(newStatsusRef, {
                            username: usernameInput,
                            statsus: "online"
                        });
                    }

                    // 3. نجاح العملية وحفظ اسم المستخدم في التخزين المحلي
                    message.style.color = 'green';
                    message.textContent = 'تم تسجيل الدخول بنجاح! جاري تحويلك...';
                    
                    localStorage.setItem("loggedInUser", usernameInput);

                    // 4. التوجيه التلقائي لصفحة index.html بعد ثانية واحدة
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);

                } else {
                    // إذا لم يتم العثور على اسم المستخدم في جدول users
                    message.style.color = 'red';
                    message.textContent = 'اسم المستخدم غير موجود، تأكد من كتابته بشكل صحيح أو انشئ حساباً جديداً.';
                }

            } catch (error) {
                console.error("خطأ في تسجيل الدخول أو تحديث الحالة: ", error);
                message.style.color = 'red';
                message.textContent = 'حدث خطأ: ' + error.message;
            }
        });
    </script>

</body>
</html>
